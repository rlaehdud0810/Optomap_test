<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Optomap Diagnostic Test</title>
    <style>
        img { max-width: 300px; margin: 10px; }
        .images { display: flex; justify-content: center; }
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>Diagnostic Test</h1>
    <p>아래 3장의 사진을 보고 진단을 선택하세요.</p>
    <div class="images">
        <img src="static/images/Figure 1A.jpg" alt="Figure 1A">
        <img src="static/images/Figure 1B.jpg" alt="Figure 1B">
        <img src="static/images/Figure 1C.jpg" alt="Figure 1C">
    </div>

    <form id="quizForm">
        <input type="radio" name="diagnosis" value="Normal" id="normal">
        <label for="normal">1. Normal</label><br>

        <input type="radio" name="diagnosis" value="Glaucoma suspect" id="suspect">
        <label for="suspect">2. Glaucoma suspect</label><br>

        <input type="radio" name="diagnosis" value="Glaucoma" id="glaucoma">
        <label for="glaucoma">3. Glaucoma</label><br><br>

        <button type="button" onclick="checkAnswer()">제출</button>
    </form>

    <p id="result" style="font-weight:bold; margin-top:20px;"></p>

    <script>
        const correctAnswer = "Normal";

        function checkAnswer() {
            const form = document.getElementById("quizForm");
            let selected = null;
            const radios = document.getElementsByName('diagnosis');
            for(let i=0;i<radios.length;i++){
                if(radios[i].checked){
                    selected = radios[i].value;
                    break;
                }
            }
            const result = document.getElementById("result");
            if (!selected) {
                result.textContent = "먼저 선택해주세요!";
                return;
            }
            if (selected === correctAnswer) {
                result.textContent = "정답입니다!";
                result.style.color = "green";
            } else {
                result.textContent = "틀렸습니다.";
                result.style.color = "red";
            }
        }
    </script>
</body>
</html>
